        <!-- Notification Toast (Hidden by default) -->

            Contact saved to your downloads!
        </div>

    <!-- JavaScript Logic -->
    <script>
        /**
         * Dynamically generates a vCard (.vcf) file containing the profile details
         * and triggers standard browser download mechanism.
         */
        function downloadVCard() {
            // vCard standard content
            const vCardData = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'N:Mostafa;Mohd. Maruf;;;',
                'FN:Mohd. Maruf Mostafa',
                'TITLE:IT Specialist',
                'TEL;TYPE=CELL,VOICE:+8801789562659',
                'EMAIL;TYPE=INTERNET,HOME:banglagtavc@gmail.com',
                'URL;TYPE=Blog:https://banglagtavicecity.blogspot.com',
                'URL;TYPE=YouTube:https://youtube.com/@icejackal1984',
                'URL;TYPE=Twitch:https://twitch.tv/icejackal1984',
                'URL;TYPE=Facebook:https://facebook.com/banglagtavicecity',
                'ADR;TYPE=HOME:;;Mirpur;Dhaka;;1216;Bangladesh',
                'END:VCARD'
            ].join('\n');

            try {
                // Create Blob with vCard MIME type
                const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
                
                // Create hidden anchor element to initiate download
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.setAttribute('download', 'Mohd_Maruf_Mostafa.vcf');
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Show visual feedback toast
                showToast();
            } catch (err) {
                console.error('Error generating vCard:', err);
            }
        }

        /**
         * Helper function to show a notification toast
         */
        function showToast() {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.classList.remove('hidden');
                toast.style.opacity = '1';
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.classList.add('hidden'), 300);
                }, 3000);
            }
        }
    </script>
