<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md Mehedi Hasan - Digital Contact Card</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #e9ecef;
        }
        
        .card-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.05);
        }

        /* Custom subtle scrollbar if needed */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8">

    <!-- Contact Card Container -->
    <main class="w-full max-w-[460px] bg-white rounded-xl card-shadow p-6 sm:p-10 transition-all duration-300">
        
        <!-- Profile Header Section -->
        <div class="flex flex-col items-center text-center mb-6">
            <!-- Name, Title & Company -->
            <h1 class="text-2xl sm:text-[26px] font-semibold text-slate-800 tracking-tight leading-snug">
                Md Mehedi Hasan
            </h1>
            <p class="text-sm text-slate-500 font-medium mt-1">
                Assistant Manager
            </p>
            <p class="text-sm text-slate-600 font-semibold mt-1">
                Hasan International (RL-942)
            </p>
        </div>

        <!-- Contact Details Section -->
        <div class="space-y-4">
            <h2 class="text-xs font-medium text-slate-500 tracking-wide mb-3">
                Contact details
            </h2>

            <ul class="space-y-3.5">
                <!-- Phone -->
                <li>
                    <a href="tel:+8801410674044" class="flex items-center gap-4 text-slate-700 hover:text-slate-950 transition-colors group">
                        <div class="w-8 flex items-center justify-center text-slate-600 group-hover:text-slate-900 transition-colors">
                            <i class="fa-solid fa-phone text-lg"></i>
                        </div>
                        <span class="text-sm font-normal tracking-wide sm:text-base">
                            +8801410-674044
                        </span>
                    </a>
                </li>

                <!-- Email -->
                <li>
                    <a href="mailto:hasan.intl@gmail.com" class="flex items-center gap-4 text-slate-700 hover:text-slate-950 transition-colors group">
                        <div class="w-8 flex items-center justify-center text-slate-600 group-hover:text-slate-900 transition-colors">
                            <i class="fa-solid fa-envelope text-lg"></i>
                        </div>
                        <span class="text-sm font-normal tracking-wide sm:text-base break-all">
                            hasan.intl@gmail.com
                        </span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- QR Code Section -->
        <div class="mt-8 pt-6 border-t border-slate-100 flex flex-col items-center justify-center">
            <!-- WhatsApp Callout Text with Icon -->
            <div class="flex items-center gap-2 text-xs font-medium text-slate-600 mb-3">
                <i class="fa-brands fa-whatsapp text-emerald-500 text-base"></i>
                <span>Scan the QR code to reach me in Whatsapp</span>
            </div>

            <div class="p-2 bg-white rounded-lg border border-slate-200 shadow-sm">
                <!-- Replace 'qr-code.png' with your actual QR code image path or URL -->
                <img 
                    src="qr-code.png" 
                    alt="Scan QR Code" 
                    class="w-36 h-36 object-contain rounded"
                    onerror="this.onerror=null; this.src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://wa.me/8801410674044';"
                />
            </div>
        </div>

    </main>

</body>
</html>
